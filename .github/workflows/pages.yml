name: Deploy AIGC paper reader to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefix paper-reader-prototype --no-audit --no-fund
      - name: Build the prototype
        run: npm run build --prefix paper-reader-prototype -- --base=/AIGC/paper-reader-prototype/
      - name: Assemble the site
        run: |
          mkdir -p _site/paper-reader-prototype
          cp -R paper-reader-prototype/dist/. _site/paper-reader-prototype/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
